---
name: Build container image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'LICENSE-*'
      - 'cosign.pub'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: agent-sandbox
  IMAGE_REGISTRY: ghcr.io/butterflyskies

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test storage inventory
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Set build variables
        id: vars
        run: |
          CALVER="$(date -u +%Y%m%d)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_VERSION="pr-${{ github.event.pull_request.number }}"
          else
            IMAGE_VERSION="${CALVER}-${GITHUB_SHA::7}"
          fi
          {
            echo "calver=${CALVER}"
            echo "build_date=${BUILD_DATE}"
            echo "image_version=${IMAGE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ steps.vars.outputs.image_version }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_VERSION=${{ steps.vars.outputs.image_version }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            GIT_SHA=${{ github.sha }}

      - name: Report storage inventory
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          IMAGE_REF="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          IMAGE_SIZE_BYTES="$(docker image inspect --format '{{.Size}}' "$IMAGE_REF")"
          INVENTORY_JSON="$(docker run --rm --entrypoint cat "$IMAGE_REF" \
            /usr/share/agent-sandbox/home-template-inventory.json)"
          TEMPLATE_BYTES="$(jq -r '.totals.apparent_bytes' <<<"$INVENTORY_JSON")"
          SOFTWARE_BYTES="$(jq -r \
            '.owners[] | select(.owner == "image-owned-software") | .apparent_bytes' \
            <<<"$INVENTORY_JSON")"
          {
            echo "### Storage inventory"
            echo ""
            echo "| Measurement | Bytes |"
            echo "|---|---:|"
            echo "| Loaded image | $IMAGE_SIZE_BYTES |"
            echo "| Empty persistent-HOME payload | $TEMPLATE_BYTES |"
            echo "| HOME-owned software payload | $SOFTWARE_BYTES |"
            echo ""
            echo "Budget ceilings remain unconfigured until Selene measurements are ratified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
