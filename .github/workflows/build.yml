---
name: Build container image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'LICENSE-*'
      - 'cosign.pub'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: agent-sandbox
  IMAGE_REGISTRY: ghcr.io/butterflyskies

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set build variables
        id: vars
        run: |
          CALVER="$(date -u +%Y%m%d)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_VERSION="pr-${{ github.event.pull_request.number }}"
          else
            IMAGE_VERSION="${CALVER}-${GITHUB_SHA::7}"
          fi
          {
            echo "calver=${CALVER}"
            echo "build_date=${BUILD_DATE}"
            echo "image_version=${IMAGE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ steps.vars.outputs.image_version }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          file: ./Containerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_VERSION=${{ steps.vars.outputs.image_version }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            GIT_SHA=${{ github.sha }}

      - name: Build SSH variant
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --tag agent-sandbox-sshd:ci \
            --build-arg "BASE_IMAGE=${IMAGE_REGISTRY}/${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}" \
            --file Containerfile.sshd \
            .

      - name: Test SSH variant
        if: github.event_name == 'pull_request'
        run: |
          CONTAINER_RUNTIME=docker \
            IMAGE_SSHD_REF=agent-sandbox-sshd:ci \
            bash ./scripts/sshd-smoke.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
