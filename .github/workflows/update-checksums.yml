---
name: Update checksums on Renovate PRs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'

permissions: {}

jobs:
  update_checksums:
    name: Update SHA256 checksums
    runs-on: ubuntu-24.04
    if: github.actor == 'renovate[bot]'

    permissions:
      contents: write

    steps:
      # Use the release-manager GitHub App so that the push triggers
      # a re-run of build.yml. The default GITHUB_TOKEN doesn't trigger
      # workflows due to the anti-cascade rule.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Update checksums
        run: ./scripts/update-checksums.sh

      - name: Commit updated checksums
        run: |
          git diff --quiet Containerfile && exit 0
          git config user.name "butterflyskies-release-manager-bot[bot]"
          git config user.email "butterflyskies-release-manager-bot[bot]@users.noreply.github.com"
          git add Containerfile
          git commit -m "chore(deps): update SHA256 checksums"
          git push
